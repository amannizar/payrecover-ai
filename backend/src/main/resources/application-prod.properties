# ═══════════════════════════════════════════════════════════════════════════════
# Production Profile — MySQL/PostgreSQL, environment variables
# ═══════════════════════════════════════════════════════════════════════════════

# Database — MySQL (switch to PostgreSQL by changing driver and dialect)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payrecover}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:payrecover}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 Console — disabled in production
spring.h2.console.enabled=false

# Thymeleaf — cache enabled for performance
spring.thymeleaf.cache=true

# FastAPI AI Service — from environment
payrecover.ai.service-url=${AI_SERVICE_URL:http://127.0.0.1:8001}

# Logging — production level
logging.level.com.payrecover=WARN
logging.level.org.springframework.web=INFO

# Demo reset — disabled in production
payrecover.demo.reset-enabled=false

# Actuator — expose health endpoint for deployment verification
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
