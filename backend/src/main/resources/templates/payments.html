<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayRecover AI — Payments</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <nav class="navbar">
        <div class="brand"><span class="brand-icon">🛡️</span> PayRecover AI</div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/payments" class="active">Payments</a>
            <a href="/evaluation">Evaluation</a>
            <a href="/audit">Audit</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Failed Payments</h1>
            <span class="badge" th:text="${#lists.size(payments)} + ' total'">0 total</span>
        </div>

        <!-- Search -->
        <form class="search-bar" method="get" action="/payments">
            <input type="text" name="q" placeholder="Search by Payment ID or Customer ID…"
                   th:value="${query}" />
            <button type="submit" class="btn-primary">Search</button>
        </form>

        <!-- Table -->
        <div class="card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Payment ID</th>
                        <th>Amount</th>
                        <th>Method</th>
                        <th>Bank</th>
                        <th>Failure Code</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${payments}">
                        <td class="mono" th:text="${p.paymentId}">PAY_000000</td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(p.amount, 1, 'COMMA', 0, 'POINT')}">₹0</td>
                        <td><span class="badge-method" th:text="${p.paymentMethod}">UPI</span></td>
                        <td th:text="${p.bank}">HDFC</td>
                        <td th:text="${p.failureCode}">BANK_TIMEOUT</td>
                        <td>
                            <span class="badge-temporary" th:if="${p.failureCategory == 'TEMPORARY'}" th:text="${p.failureCategory}">TEMP</span>
                            <span class="badge-customer" th:if="${p.failureCategory == 'CUSTOMER'}" th:text="${p.failureCategory}">CUST</span>
                            <span class="badge-hard" th:if="${p.failureCategory == 'HARD'}" th:text="${p.failureCategory}">HARD</span>
                        </td>
                        <td>
                            <span class="badge-failed" th:if="${p.status == 'FAILED'}">FAILED</span>
                            <span class="badge-success" th:if="${p.status == 'RECOVERED'}">RECOVERED</span>
                            <span class="badge-stopped" th:if="${p.status != 'FAILED' and p.status != 'RECOVERED'}" th:text="${p.status}">--</span>
                        </td>
                        <td><a th:href="@{/payments/{id}(id=${p.paymentId})}" class="btn-sm">Analyze</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
