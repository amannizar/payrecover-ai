# ═══════════════════════════════════════════════════════════════════════════════
# PayRecover AI — Base Configuration
# Profile-specific overrides: application-dev.properties, application-prod.properties
# Activate: spring.profiles.active=dev  (or prod)
# ═══════════════════════════════════════════════════════════════════════════════

# Server
server.port=${PORT:8080}

# Default profile: dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database — defaults to H2 (overridden by profile)
spring.datasource.url=${DB_URL:jdbc:h2:mem:payrecover;DB_CLOSE_DELAY=-1;MODE=MYSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA — defaults to H2 (overridden by profile)
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL:create-drop}
spring.jpa.show-sql=${SHOW_SQL:false}

# H2 Console
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# FastAPI AI Service
payrecover.ai.service-url=${AI_SERVICE_URL:http://127.0.0.1:8001}

# Logging
logging.level.com.payrecover=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL:INFO}

# Demo reset — only enabled in dev profile
payrecover.demo.reset-enabled=${DEMO_RESET_ENABLED:false}

# Actuator — health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
