# ═══════════════════════════════════════════════════════════════════════════════
# Development Profile — H2 in-memory database, localhost services
# ═══════════════════════════════════════════════════════════════════════════════

# Database — H2 in-memory
spring.datasource.url=jdbc:h2:mem:payrecover;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf — no caching for faster dev iteration
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# FastAPI AI Service — Docker uses AI_SERVICE_URL env var (http://fastapi:8001)
payrecover.ai.service-url=${AI_SERVICE_URL:http://127.0.0.1:8001}

# Logging
logging.level.com.payrecover=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL:DEBUG}

# Demo reset allowed
payrecover.demo.reset-enabled=${DEMO_RESET_ENABLED:true}

# Actuator — expose health and info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
